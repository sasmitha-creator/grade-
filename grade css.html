
<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f5f9;
            padding: 40px;
        }

        .box {
            background-color: white;
            padding: 25px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 90%;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            background-color: #2563eb;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Grade Calculator</h2>

        <input type="number" placeholder="Enter mark 1" id="mark1">
        <input type="number" placeholder="Enter mark 2" id="mark2">
        <input type="number" placeholder="Enter mark 3" id="mark3">
        <input type="number" placeholder="Enter mark 4" id="mark4">
        <input type="number" placeholder="Enter mark 5" id="mark5">

        <button onclick="grade()">Calculate Grade</button>

        <p id="result"></p>
    </div>

    <script>
        function grade()
        {
            let mark1 = Number(document.getElementById("mark1").value);
            let mark2 = Number(document.getElementById("mark2").value);
            let mark3 = Number(document.getElementById("mark3").value);
            let mark4 = Number(document.getElementById("mark4").value);
            let mark5 = Number(document.getElementById("mark5").value);

            let sum = mark1 + mark2 + mark3 + mark4 + mark5;
            let avg = sum / 5;
            let result = "";

            if (avg >= 90)
            {
                result = "Your grade is A";
            }
            else if (avg >= 80)
            {
                result = "Your grade is B";
            }
            else if (avg >= 70)
            {
                result = "Your grade is C";
            }
            else if (avg >= 50)
            {
                result = "Your grade is D";
            }
            else
            {
                result = "Your grade is F";
            }

            document.getElementById("result").innerHTML =
                "Total: " + sum + "<br>" + result;
        }
    </script>

</body>
</html>
